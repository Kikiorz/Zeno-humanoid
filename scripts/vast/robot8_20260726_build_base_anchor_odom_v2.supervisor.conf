; conversion succeeds. It does not train and does not overwrite either input.
environment=PROC_NAME="%(program_name)s",REPO_ROOT="/workspace/2027icra",VENV_DIR="/workspace/2027icra/third_party/lerobot/.venv",PYTHONUNBUFFERED="1"
command=/workspace/2027icra/scripts/vast/robot8_20260726_build_base_anchor_odom_v2.sh
directory=/workspace/2027icra
autostart=false
autorestart=false
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=300
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
